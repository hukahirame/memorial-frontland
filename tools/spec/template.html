<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Admin～メモフロ～</title>
<!--
  管理のページのひな形。tools/spec/build.py が docs/systems の仕様書・docs/DECISIONS.md・原簿を読み、
  下の DATA に入れて .spec/admin.html を書く。中身はここに書かない（書いた所が 2 つになる）。
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f3; --panel: #ffffff; --sunk: #f0f0ec; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5fd0; --ok: #1f8a4c; --ng: #c8372d; --warn: #a86400;
  --t-trigger: #2f5fd0; --t-while: #7a45c9; --t-if: #1f8a4c; --removed: #fcebe9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --panel: #1e1e1c; --sunk: #262624; --text: #ecebe6; --muted: #a09f98; --line: #34342f;
    --accent: #86a8ff; --ok: #5cc98a; --ng: #ff7b70; --warn: #e0a64a;
    --t-trigger: #86a8ff; --t-while: #c3a2ff; --t-if: #5cc98a; --removed: #3d2220;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --panel: #1e1e1c; --sunk: #262624; --text: #ecebe6; --muted: #a09f98; --line: #34342f;
  --accent: #86a8ff; --ok: #5cc98a; --ng: #ff7b70; --warn: #e0a64a;
  --t-trigger: #86a8ff; --t-while: #c3a2ff; --t-if: #5cc98a; --removed: #3d2220;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.7 "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; }
a { color: var(--accent); }
code { font: 13px ui-monospace, Consolas, monospace; background: var(--sunk); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
pre { font: 12.5px ui-monospace, Consolas, monospace; background: var(--sunk); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
button, input { font: inherit; color: inherit; }

.top { background: var(--panel); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
.top-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.top h1 { margin: 0; font-size: 19px; }
.built { font-size: 12px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.search { flex: 1 1 auto; min-width: 0; max-width: 360px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--text); font-size: 13px; }
.nav, .to-top { width: 32px; height: 32px; padding: 0; line-height: 1; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; }
.nav:hover:not(:disabled), .to-top:hover { border-color: var(--accent); }
.nav:disabled { color: var(--muted); opacity: .5; cursor: default; }
.to-top { position: fixed; right: 16px; bottom: 16px; z-index: 5; width: 40px; height: 40px; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.to-top[hidden] { display: none; }

.layout { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; padding: 16px; }
.toc { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 5px; max-height: calc(100vh - 32px); overflow-y: auto; padding-bottom: 8px; }
.toc-label { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
.toc-label:first-child { margin-top: 0; }
.toc a { display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 5px 8px; line-height: 1.4; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: inherit; text-decoration: none; }
.toc a[aria-current="page"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.toc-name { font-weight: 600; font-size: 13px; }
.toc-sub { font-size: 11px; color: var(--warn); }
main { min-width: 0; }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .toc { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 4px; }
  .toc-label { display: none; }
  .toc a { min-width: 112px; flex: 0 0 auto; }
}

.problems { background: var(--removed); border: 1px solid var(--ng); border-radius: 10px; padding: 10px 16px; margin-bottom: 12px; }
.head { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.head-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.head h2 { margin: 0; font-size: 20px; }
.kind { font-size: 12px; color: var(--muted); }
.purpose { margin: 6px 0 0; font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }

.group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 14px; margin-bottom: 12px; }
.group h3 { font-size: 16px; margin: 12px 0 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.group h4 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); }
details.group > summary { cursor: pointer; font-weight: 600; font-size: 16px; margin: 12px 0 6px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.item { padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; overflow-wrap: anywhere; scroll-margin-top: 80px; }
.item.d1 { margin-left: 22px; border-style: dotted; }
.k-open .item { border-style: dashed; border-color: var(--warn); }
.k-not .item { color: var(--muted); }
.item.flash { outline: 2px solid var(--accent); }
.hit { cursor: pointer; }
.hit:hover { border-color: var(--accent); }
.from { display: block; font-size: 11px; color: var(--muted); }
.para { margin: 6px 0; overflow-wrap: anywhere; }
.ears { font: 600 11px ui-monospace, Consolas, monospace; margin-right: 6px; }
.e-trigger { color: var(--t-trigger); }
.e-while { color: var(--t-while); }
.e-if { color: var(--t-if); }
.badge { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.warn { color: var(--warn); border-color: currentColor; }
.adr { font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--sunk); color: var(--ok); cursor: pointer; white-space: nowrap; }
.adr.broken { color: var(--ng); cursor: default; }
.adr.old { color: var(--muted); text-decoration: line-through; }
.adr.open { color: var(--warn); }
.adr.marked::after { content: '!'; color: var(--warn); font-weight: bold; margin-left: 2px; }
.attention { color: var(--warn); font-size: 12px; margin: 4px 0; overflow-wrap: anywhere; }
.state { font-size: 11px; font-weight: normal; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.state[data-state="確定"] { color: var(--ok); }
.state[data-state="保留中"] { color: var(--warn); }
.state[data-state="置き換え"], .state[data-state="廃止"] { color: var(--muted); }
.state-head { font-size: 13px; color: var(--muted); margin: 16px 2px 6px; }
.adr-title { font-weight: 600; text-decoration: none; }
.none { color: var(--muted); font-size: 13px; margin: 6px 0; }
.adr-entry { scroll-margin-top: 80px; }
.adr-entry h3 .date { margin-left: auto; }
.adr-kind { font-size: 18px; line-height: 1; cursor: default; }
a.ev::before { content: "⚡"; font-size: 0.85em; margin-right: 1px; }
.adr-kind.side { float: right; margin: 0 0 4px 8px; }
.adr-entry details { margin-top: 6px; }
.adr-entry summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.adr-part { margin: 8px 0 0; font-size: 13px; }
.adr-part b { display: block; color: var(--muted); font-size: 12px; }
.adr-part p { margin: 2px 0 6px; overflow-wrap: anywhere; }
.adr-old { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.adr-old li { padding: 7px 10px; border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); overflow-wrap: anywhere; scroll-margin-top: 80px; }
.adr-old li b { color: var(--text); font-weight: 600; }
.adr-box { margin: 6px 0 2px; padding: 8px 10px; border-left: 3px solid var(--ok); background: var(--sunk); border-radius: 6px; font-size: 13px; }
.adr-box p { margin: 4px 0 0; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
.pick:empty { display: none; }
.pick button, .connect { height: 26px; padding: 0 7px; font-size: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; }
.pick button:hover:not(:disabled), .connect:hover { border-color: var(--accent); }
.pick button:disabled { opacity: .45; cursor: default; }
.pick .opt[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pick .opt + [data-act] { margin-left: 4px; }
.pick-state { font-size: 12px; color: var(--muted); margin-left: 4px; }
.pick-state.ng { color: var(--ng); }
.ext { text-decoration: underline dotted; }
.small { font-size: 12px; color: var(--muted); font-weight: normal; }
.scroll { overflow-x: auto; }
table.md { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
table.md th, table.md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
table.md th { background: var(--sunk); white-space: nowrap; }


.pager { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0 24px; font-size: 13px; }
.pager a { text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.pager a:hover { border-color: var(--accent); }
.pager .next { margin-left: auto; text-align: right; }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="top-title"><h1>Admin～メモフロ～</h1><span class="built" id="built"></span></div>
    <div class="tools">
      <button type="button" id="back" class="nav" title="戻る" aria-label="戻る">←</button>
      <button type="button" id="forward" class="nav" title="進む" aria-label="進む">→</button>
      <input type="search" id="search" class="search" placeholder="全ページから探す（/ キー）" aria-label="全ページから探す">
    </div>
  </div>
</header>
<button type="button" id="top" class="to-top" title="先頭へ" aria-label="先頭へ" hidden>↑</button>
<div class="layout">
  <nav class="toc" id="toc" aria-label="目次"></nav>
  <main id="main"></main>
</div>
<script>
(() => {
  'use strict';
  const DATA = /*DATA*/null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  /** ページと、その中の場所を指す住所。#roots や #adrs/adr-D-34。ブラウザの戻る・進む・再読み込み・新しいタブで開くがこれで効く */
  const href = (page, anchor) => '#' + page + (anchor ? '/' + anchor : '');
  const SYSTEMS = DATA.systems;
  const EVENT_LIST = DATA.events || [];  // 仕組みをまたぐ出来事。起こす仕様書の ## 出来事 と、それを指す反応
  const EVENTS = new Map(EVENT_LIST.map((ev) => [ev.key, ev]));
  // 企画は暗号で git に入れるので、鍵の無い手元では読めない（sections が null）
  const CONCEPT = DATA.concept.sections ? { id: 'concept', name: '企画 📘', sections: DATA.concept.sections } : null;
  const byId = new Map([...(CONCEPT ? [CONCEPT] : []), ...SYSTEMS].map((s) => [s.id, s]));
  const KIND = { 用語: 'terms', 受け入れ条件: 'links', やらないこと: 'not', 未決: 'open' };
  const EARS = [['WHEN ', 'trigger'], ['WHILE ', 'while'], ['IF ', 'if']];

  /** 「根源 🌳」を名前と絵文字に分ける */
  const split = (name) => {
    const m = name.match(/^(.*?)\s*(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)$/u);
    return m ? { title: m[1], icon: m[2] } : { title: name, icon: '📄' };
  };
  const sectionOf = (s, title) => s.sections.find((x) => x.title === title);
  const listItems = (sec) => (sec ? sec.blocks.filter((b) => b.type === 'list').flatMap((b) => b.items) : []);
  const unwritten = (sec) => !sec || sec.blocks.every((b) => b.type === 'p' && /^（未記入/.test(b.text));

  // ── 文の小さな書式：`コード`・**太字**・[文](仕様書.md)・[D-番号] ──
  function inline(text) {
    const codes = [];
    let s = esc(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0002`; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, target) => {
      const file = target.split('#')[0];
      const id = !file.includes('/') && file.endsWith('.md') ? file.slice(0, -3) : null;
      const ev = id && EVENTS.get(`ev-${id}-${target.split('#')[1]}`);
      if (ev) return `<a class="ev" href="${href(ev.key)}" data-page="${ev.key}" title="出来事">${label}</a>`;
      return id && byId.has(id) ? `<a href="#${id}" data-page="${id}">${label}</a>` : `<span class="ext" title="${target}">${label}</span>`;
    });
    s = s.replace(/\[(D-\d+)\](?!\()/g, (_, id) => adrChip(id));
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return s.replace(/\u0001(\d+)\u0002/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  const RETIRED = ['置き換え', '廃止'];  // もう効かない設計判断
  const live = (a) => !RETIRED.includes(a.state);
  const stateBadge = (a) => `<span class="state" data-state="${esc(a.state)}">${esc(a.state)}</span>`;
  const chosenText = (a) => (a.chosen ? `<span class="small">選択 (${esc(a.chosen)})</span>` : '');
  // 注意の印。注意: の行か、前提の答えが変わったもの。人が見たら注意: の行を消す
  const marked = (a) => live(a) && a.attention.length > 0;
  const markBadge = (a) => (marked(a) ? ' <span class="badge warn">注意</span>' : '');
  const markText = (a) => (marked(a) ? `<p class="attention">${a.attention.map(inline).join('<br>')}</p>` : '');
  function adrChip(id) {
    const a = DATA.adrs[id];
    if (!a) return `<span class="adr broken" title="判断の記録に無い">${id}</span>`;
    const look = (!live(a) ? ' old' : a.state === '保留中' ? ' open' : '') + (marked(a) ? ' marked' : '');
    return `<button type="button" class="adr${look}" data-adr="${id}" title="${esc(a.title)}（${esc(a.state)}${marked(a) ? '・注意' : ''}）">${id}</button>`;
  }
  function toggleAdr(button) {
    const host = button.closest('li, p, td, .adr-box') || button.parentElement;
    const id = button.dataset.adr;
    const open = host.querySelector(`:scope > .adr-box[data-adr="${id}"]`);
    if (open) { open.remove(); return; }
    const a = DATA.adrs[id];
    host.insertAdjacentHTML('beforeend', `<div class="adr-box" data-adr="${id}"><b>[${id}] ${esc(a.title)}</b> ${stateBadge(a)}${markBadge(a)} ${chosenText(a)}` +
      `${markText(a)}${a.decision ? `<p>決定 — ${inline(a.decision)}</p>` : ''}<p><a href="${href('adrs', 'adr-' + id)}" data-page="adrs" data-anchor="adr-${id}">全文</a></p></div>`);
  }

  // ── 仕様書の塊 ──
  function itemHtml(item, kind, anchor) {
    let text = item.text, mark = '';
    if (kind === 'links') {
      const hit = EARS.find(([word]) => text.startsWith(word));
      if (hit) { mark = `<span class="ears e-${hit[1]}">${hit[0].trim()}</span>`; text = text.slice(hit[0].length); }
    }
    const body = inline(text).replace(/ THEN /, ' <span class="ears e-if">THEN</span> ');
    return `<li class="item d${item.depth}" id="${anchor}">${mark}${body}</li>`;
  }
  const tableHtml = (head, rows) =>
    `<div class="scroll"><table class="md"><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c ? inline(c) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  function blocksHtml(s, si, sec) {
    const kind = KIND[sec.title] || 'rules';
    return sec.blocks.map((b, bi) => {
      const base = `${s.id}-${si}-${bi}`;
      if (b.type === 'h') return `<h4>${inline(b.text)}</h4>`;
      if (b.type === 'p') return `<p class="para" id="${base}">${inline(b.text)}</p>`;
      if (b.type === 'code') return `<pre>${esc(b.text)}</pre>`;
      // 出来事の表は、名前から出来事のページへ飛べるようにする
      if (b.type === 'table') return tableHtml(b.head, sec.title === '出来事' ? b.rows.map(([name, ...rest]) => [`[${name}](${s.id}.md#${name})`, ...rest]) : b.rows);
      return `<ul class="items">${b.items.map((it, ii) => itemHtml(it, kind, `${base}-${ii}`)).join('')}</ul>`;
    }).join('');
  }
  const sectionHtml = (s, sec) => {
    const si = s.sections.indexOf(sec);
    const kind = KIND[sec.title] || 'rules';
    return `<section class="group k-${kind}"><h3>${esc(sec.title)}</h3>${blocksHtml(s, si, sec)}</section>`;
  };
  const head = (icon, title, kind, purpose, facts) =>
    `<div class="head"><div class="head-title"><h2>${icon} ${esc(title)}</h2><span class="kind">${esc(kind)}</span></div>` +
    (purpose ? `<p class="purpose">${purpose}</p>` : '') + (facts ? `<div class="facts">${facts}</div>` : '') + '</div>';
  const pageLink = (id) => `<a href="#${id}" data-page="${id}">${esc(split(byId.get(id).name).title)}</a>`;

  // ── ページ ──
  const conceptBlanks = () => (CONCEPT ? CONCEPT.sections.filter(unwritten).length : 0);
  function renderConcept() {
    const facts = `<span>正本 <code>${esc(DATA.concept.source)}</code>（暗号で git に入れる）</span><span>確定していないことも書く</span>`;
    let html = head('📘', '企画', '全体', 'ゲームが何で出来ていて、どうつながるか。公開しないので、正本は暗号で git に入れてある（[D-25]）。'.replace(/\[(D-\d+)\]/, (_, id) => adrChip(id)), facts);
    if (!CONCEPT) return html + `<section class="group"><p class="para">この手元では <code>${esc(DATA.concept.source)}</code> を読めない（無いか、git-crypt の鍵が無い）。</p></section>`;
    for (const sec of CONCEPT.sections) {
      html += unwritten(sec)
        ? `<section class="group"><h3>${esc(sec.title)} <span class="badge warn">未記入（人が書く）</span></h3></section>`
        : sectionHtml(CONCEPT, sec);
    }
    return html;
  }
  const adrLines = (ps) => ps.map((p) => `<p>${p.map(inline).join('<br>')}</p>`).join('');
  const adrPart = (a, name) => (a.parts[name] ? `<div class="adr-part"><b>${name}</b>${adrLines(a.parts[name])}</div>` : '');
  // 開発の作り方か、ゲームそのものか。文字は出さず、絵だけを右に置く
  const KINDS = { dev: ['🛠️', '開発の作り方'], game: ['🎮', 'ゲームそのもの'] };
  const kindIcon = (a, cls = '') => {
    const [icon, label] = KINDS[a.game ? 'game' : 'dev'];
    return `<span class="adr-kind ${cls}" title="${label}" aria-label="${label}">${icon}</span>`;
  };
  const adrsOf = (state) => Object.entries(DATA.adrs).filter(([, a]) => a.state === state);
  const markedCount = () => Object.values(DATA.adrs).filter(marked).length;
  const adrCounts = () => ['確定', '保留中', ...RETIRED].map((state) => `<span>${state} ${adrsOf(state).length}</span>`).join('') +
    (markedCount() ? `<span>注意 ${markedCount()}</span>` : '');
  function adrEntry(id, a) {
    const facts = [];
    if (a.premises.length) facts.push(`<span>前提：${a.premises.map((p) => `${adrChip(p.id)} (${esc(p.option)})`).join(' ')}</span>`);
    if (a.dependents.length) facts.push(`<span>これを前提にしている：${a.dependents.map(adrChip).join(' ')}</span>`);
    if (a.systems.length) facts.push(`<span>仕組み：${a.systems.map(pageLink).join('・')}</span>`);
    facts.push(`<span>指している所：${a.refs.length ? a.refs.map((r) => `<code>${esc(r)}</code>`).join(' ') : 'なし'}</span>`);
    const body = a.decision
      ? `${adrPart(a, '決定')}<div class="facts">${facts.join('')}</div><details><summary>背景・検討した選択肢・帰結</summary>${adrPart(a, '背景')}${adrPart(a, '検討した選択肢')}${adrPart(a, '帰結')}${adrPart(a, '経緯')}</details>`
      : `${adrPart(a, '背景')}${adrPart(a, '検討した選択肢')}${adrPart(a, '経緯')}<div class="facts">${facts.join('')}</div>`;

  // 入口。人の対応が要るものだけを出す

  // ── 答える ──

  let folder = null;     // つないだ docs フォルダ

  let connectNote = '';

  const notes = {};      // 行の後ろに出す一言 { text, ng }
  const ANSWER = { try: '試す', confirm: '確定', seen: '見た' };
  const FILES = [['DECISIONS.md'], ['GAME-DECISIONS.md']];
  const fileOf = (a) => FILES[a.game ? 1 : 0];
  const canConnect = () => !folder && 'showDirectoryPicker' in window && new URLSearchParams(location.search).has('answer');
  function pickRow(id) {
    if (!folder) return '';

      html += a.options.map((o) => `<button type="button" class="opt" data-opt="${o}" aria-pressed="${o === choice}">(${o})</button>`).join('');

  function store(mode, use) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open('admin', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('kv');
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const db = open.result, req = use(db.transaction('kv', mode).objectStore('kv'));

        req.onerror = () => { db.close(); reject(req.error); };

  async function fileHandle(path) {
    let dir = folder;

  // BOM を落とさずに読む。書き戻すと BOM も改行もそのまま残る
  const readLines = async (handle) => {
    const text = new TextDecoder('utf-8', { ignoreBOM: true }).decode(await (await handle.getFile()).arrayBuffer());
    return { lines: text.split(/\r?\n/), eol: text.includes('\r\n') ? '\r\n' : '\n' };

  // 見出しの次の行から最初の空行までが、状態・選択・注意などの行（build.py の adr_entry と同じ所を読む）
  function headOf(lines, id) {
    const start = lines.findIndex((l) => l.startsWith(`## [${id}] `));
    if (start < 0) return null;
    let end = start + 1;
    while (end < lines.length && lines[end].trim() && !/^## \[D-\d+\]/.test(lines[end])) end += 1;
    const field = (name) => { const l = lines.slice(start + 1, end).find((x) => x.startsWith(name + ':')); return l ? l.slice(name.length + 1).trim() : ''; };
    const chosen = /^\(([a-z])\)$/.exec(field('選択'));
    return { start, end, state: ['確定', '保留中', ...RETIRED].find((s) => field('状態').startsWith(s)) || '', chosen: chosen ? chosen[1] : '', note: field('注意') };
  }
  // 人が確定したときに見た中身の印。選択と決定の文を、空白を除いて比べる。build.py の seal と同じ計算
  const ADR_PARTS = ['背景', '検討した選択肢', '決定', '帰結', '経緯'];
  async function sealOf(lines, id) {
    const start = lines.findIndex((l) => l.startsWith(`## [${id}] `));
    let end = lines.findIndex((l, i) => i > start && /^## \[D-\d+\]/.test(l));
    const own = lines.slice(start, end < 0 ? lines.length : end);
    const chosen = (own.find((l) => l.startsWith('選択:')) || '選択:').slice(3).trim();
    const body = [];
    let inside = false;
    for (const l of own) {
      if (l.startsWith('**決定**')) inside = true;
      else if (inside && ADR_PARTS.some((name) => l.startsWith(`**${name}**`))) break;
      if (inside) body.push(l);
    }
    const text = (chosen + '|' + body.join('')).replace(/\s+/g, '');
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));
    return [...hash].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 8);
  }
  // 頭の行の 承認: を、いまの選択と決定の印にする
  async function stamp(lines, id) {
    const h = headOf(lines, id), line = `承認: ${await sealOf(lines, id)}`;
    const at = lines.slice(h.start + 1, h.end).findIndex((l) => l.startsWith('承認:'));
    const out = [...lines];
    if (at >= 0) out[h.start + 1 + at] = line;
    else out.splice(h.end, 0, line);
    return out;
  }
  // 注意は文で比べる。文が書き換わったのに気づかず、人が読む前に消さないように
  const noteOf = (a) => (a.notice ? a.attention[0] : '');
  const differs = (a, h) => a.state !== h.state || a.chosen !== h.chosen || noteOf(a) !== h.note;
  function adopt(a, h) {
    a.attention = [...(h.note ? [h.note] : []), ...a.attention.slice(a.notice ? 1 : 0)];
    Object.assign(a, { state: h.state, chosen: h.chosen, notice: !!h.note });
  }
  // 状態・選択・日付を書き換えて注意を消す。選び直したときだけ、経緯に 1 行足す（docs/DECISIONS.md の冒頭）
  function answered(lines, h, a, action, option) {
    const d = new Date(), today = [d.getFullYear(), d.getMonth() + 1, d.getDate()].map((n) => String(n).padStart(2, '0')).join('-');
    const head = lines.slice(h.start + 1, h.end).filter((l) => !l.startsWith('注意:'));
    const set = (name, value, after) => {
      const i = head.findIndex((l) => l.startsWith(name + ':'));
      if (i >= 0) head[i] = `${name}: ${value}`;
      else head.splice(head.findIndex((l) => l.startsWith(after + ':')) + 1, 0, `${name}: ${value}`);
    };
    if (action === 'confirm') { set('状態', '確定'); set('日付', today, '選択'); }
    if (action !== 'seen') set('選択', `(${option})`, '状態');
    let last = lines.findIndex((l, i) => i > h.start && /^## \[D-\d+\]/.test(l));
    for (last = (last < 0 ? lines.length : last) - 1; last >= h.end && !lines[last].trim(); last -= 1);
    const history = [];
    if (action !== 'seen' && a.chosen && a.chosen !== option) {
      const line = `${today}、管理のページで (${a.chosen}) から (${option}) へ変えた（ユーザー）。`;
      history.push('', lines.slice(h.end, last + 1).some((l) => l.startsWith('**経緯**')) ? line : `**経緯** — ${line}`);
    }

  async function answer(row, action) {
    const id = row.dataset.pick, a = DATA.adrs[id];
    const option = action === 'seen' ? '' : selected[id] || a.chosen;
    row.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    let redraw = false;
    try {
      if ((await folder.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('書くのを許可されなかった');
      const file = await fileHandle(fileOf(a));
      const { lines, eol } = await readLines(file);
      const h = headOf(lines, id);
      if (!h) throw new Error(`${fileOf(a).join('/')} に無い`);
      if (differs(a, h)) {
        // 表示がいまの記録と違う（ほかで書き換えられた）。書かずに、いまの記録で出し直して押し直してもらう
        adopt(a, h);
        delete selected[id];
        notes[id] = { text: `記録が変わっていた（いま ${h.state}${h.chosen ? `・選択 (${h.chosen})` : ''}）`, ng: true };
        redraw = true;
      } else {
        let out = answered(lines, h, a, action, option);
        // 確定にしたときと、確定を見たときは、人がいま見た選択と決定に承認の印を付ける
        if (action === 'confirm' || (action === 'seen' && a.state === '確定')) out = await stamp(out, id);
        const writer = await file.createWritable();
        await writer.write(out.join(eol));
        await writer.close();
        adopt(a, { state: action === 'confirm' ? '確定' : a.state, chosen: action === 'seen' ? a.chosen : option, note: '' });
        if (action !== 'try') { a.attention = a.attention.filter((t) => t !== a.stale); a.stale = ''; }
        delete selected[id];
        notes[id] = { text: `「${action === 'seen' ? '見た' : `(${option}) で${ANSWER[action]}`}」を書いた` };
      }
      // 開いたときは許可が切れていて読めなかった。ほかの行も、いまの記録で出し直す
      if (!synced) { await syncFromDisk(); redraw = true; }
    } catch (e) {
      notes[id] = { text: `書けなかった（${e.message || e.name}）`, ng: true };
    }

  }
  // 許可が残っていれば、開いたときに記録を読み、ページを作ったあとの答えを表示に入れる

      for (const [id, a] of Object.entries(DATA.adrs)) {

  }

  const decideCount = (s) => Object.values(DATA.adrs).filter((a) => a.state === '保留中' && a.systems.includes(s.id)).length;

  function renderToc() {

  function pager(index) {
    const same = (p) => (p && p.group === PAGES[index].group ? p : null);
    const prev = same(PAGES[index - 1]), next = same(PAGES[index + 1]);
    const a = (p, cls, label) => `<a class="${cls}" href="#${p.key}" data-page="${p.key}">${label}</a>`;
    return `<nav class="pager">${prev ? a(prev, 'prev', `← ${prev.icon} ${esc(prev.title)}`) : ''}${next ? a(next, 'next', `${next.icon} ${esc(next.title)} →`) : ''}</nav>`;
  }
  /** y は戻る・進む・再読み込みで来たときの、前に見ていた位置。無ければ指された場所か先頭へ */
  function show(key, anchor, y) {
    const index = Math.max(0, PAGES.findIndex((p) => p.key === key));
    current = PAGES[index].key;
    main.innerHTML = PAGES[index].render() + pager(index);
    renderToc();
    document.title = `${PAGES[index].title} — Admin～メモフロ～`;
    const target = anchor && document.getElementById(anchor);
    for (let d = target && target.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
    if (y != null) {
      window.scrollTo(0, y);
    } else if (target) {
      target.scrollIntoView({ block: 'center' });
      target.classList.add('flash');
      setTimeout(() => target.classList.remove('flash'), 1600);
    } else {
      window.scrollTo(0, 0);
    }
  }

  // ── 住所（#ページ/場所、#q=探す言葉）と履歴 ──
  function parse(hash) {
    let raw = hash.replace(/^#/, '');
    try { raw = decodeURIComponent(raw); } catch (e) { /* 崩れた住所はそのまま読む */ }
    if (raw.startsWith('q=')) return { query: raw.slice(2) };
    const cut = raw.indexOf('/');
    return cut < 0 ? { page: raw || 'now', anchor: null } : { page: raw.slice(0, cut), anchor: raw.slice(cut + 1) };
  }
  function render(r, y) {
    if (r.query !== undefined) {
      if (searchBox.value.trim() !== r.query) searchBox.value = r.query;
      search(r.query);
      window.scrollTo(0, y || 0);
    } else {
      searchBox.value = '';
      show(r.page, r.anchor, y);
    }
  }
  // 履歴の 1 件ごとに、住所と見ていた位置を控える。住所を URL に書けない開き方（アプリの中の写しなど）でも、戻る・進むが効く
  let shown = null;  // いま描いている住所
  let index = 0;     // このページを開いてから何件目の履歴に居るか
  let last = 0;      // 進むで行ける、いちばん先の件
  const setState = (method, hash, y) => {
    const state = { route: hash, y, i: index };
    try { history[method](state, '', hash); return; } catch (e) { /* URL を書き換えられない。住所は state だけに持つ */ }
    try { history[method](state, ''); } catch (e) { /* 履歴が使えない。移るだけになる */ }
  };
  const saveScroll = () => { if (shown) setState('replaceState', shown, window.scrollY); };
  const stateY = (state) => (state && typeof state.y === 'number' ? state.y : null);
  function draw(hash, y) {
    shown = hash;
    render(parse(hash), y);
    // ブラウザが履歴の前後を教えてくれるならそれを使い、教えてくれない開き方では自分で数えた件で決める
    const nav = window.navigation && window.navigation.currentEntry ? window.navigation : null;
    backButton.disabled = nav ? !nav.canGoBack : index === 0;
    forwardButton.disabled = nav ? !nav.canGoForward : index >= last;
  }
  /** 移る。replace は履歴を足さずに今の 1 件を差し替える（探す言葉を打っている途中） */
  function navigate(hash, replace) {
    saveScroll();
    if (hash !== shown) {
      if (!replace) { index += 1; last = index; }
      setState(replace ? 'replaceState' : 'pushState', hash, 0);
    }
    draw(hash, null);
  }
  window.addEventListener('popstate', (e) => {
    if (e.state && typeof e.state.route === 'string') {
      index = typeof e.state.i === 'number' ? e.state.i : index;
      draw(e.state.route, stateY(e.state));
    } else {
      // 住所を手で打ち替えた。ブラウザが足した 1 件に、住所と件を控える
      index += 1;
      last = index;
      setState('replaceState', location.hash || href('now'), 0);
      draw(location.hash || href('now'), null);
    }
  });
  // 住所を手で打ち替えたとき。popstate で描き終えていれば何もしない
  window.addEventListener('hashchange', () => { if (location.hash && location.hash !== shown) draw(location.hash, null); });
  let scrollTimer = 0;
  window.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(saveScroll, 150);
    topButton.hidden = window.scrollY < 600;
  }, { passive: true });

  // ── 探す ──
  function search(query) {
    const q = query.trim().toLowerCase();
    document.title = `「${query.trim()}」を探す — Admin～メモフロ～`;
    const hits = [];
    for (const s of byId.values()) {
      s.sections.forEach((sec, si) => sec.blocks.forEach((b, bi) => {
        const base = `${s.id}-${si}-${bi}`;
        const from = `${split(s.name).title} › ${sec.title}`;
        const push = (text, anchor) => { if (text.toLowerCase().includes(q)) hits.push({ page: s.id, from, text, anchor }); };
        if (b.type === 'list') b.items.forEach((item, ii) => push(item.text, `${base}-${ii}`));
        else if (b.type === 'p') push(b.text, base);
        else if (b.type === 'table') b.rows.forEach((row) => push(row.join(' ｜ '), ''));
      }));
    }
    for (const [id, a] of Object.entries(DATA.adrs)) {
      const text = `[${id}] ${a.title}`;
      if (`${text} ${a.decision}`.toLowerCase().includes(q)) hits.push({ page: 'adrs', from: `設計判断› ${a.state}`, text, anchor: `adr-${id}` });
    }
    main.innerHTML = head('🔎', `「${query.trim()}」`, '探す', `${hits.length} 件`, '') +
      `<section class="group"><ul class="items">${hits.slice(0, 300).map((h) =>
        `<li class="item hit" data-page="${h.page}" data-anchor="${h.anchor}"><span class="from">${esc(h.from)}</span>${inline(h.text)}</li>`).join('')}</ul></section>`;
  }

  document.addEventListener('click', (e) => {
    const button = e.target.closest('.pick[data-pick] button');
    if (button) {
      const row = button.closest('.pick');
      if (button.dataset.opt) { selected[row.dataset.pick] = button.dataset.opt; row.innerHTML = pickRow(row.dataset.pick); }
      else answer(row, button.dataset.act);
      return;
    }
    if (e.target.closest('.connect')) { connect(); return; }
    const adr = e.target.closest('[data-adr]');
    if (adr && adr.tagName === 'BUTTON') { e.preventDefault(); toggleAdr(adr); return; }
    const link = e.target.closest('[data-page]');
    if (!link) return;
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;  // 新しいタブや窓で開くのはブラウザに任せる
    e.preventDefault();
    navigate(href(link.dataset.page, link.dataset.anchor || null));
  });
  backButton.addEventListener('click', () => history.back());
  forwardButton.addEventListener('click', () => history.forward());
  topButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  const searching = () => parse(shown || '').query !== undefined;
  let timer = 0;
  searchBox.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const q = searchBox.value.trim();
      if (q) navigate('#q=' + encodeURIComponent(q), searching());
      else if (searching()) navigate(href(current), true);
    }, 120);
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/' && document.activeElement !== searchBox) {
      e.preventDefault();
      searchBox.focus();
      searchBox.select();
    } else if (e.key === 'Escape' && document.activeElement === searchBox) {
      searchBox.value = '';
      searchBox.blur();
      if (searching()) navigate(href(current), true);
    }
  });

  document.getElementById('built').textContent = `${DATA.built} に作った`;
  try { history.scrollRestoration = 'manual'; } catch (e) { /* 無くても動く */ }
  // 再読み込みでは、控えた住所と位置から始める
  const first = history.state && typeof history.state.route === 'string' ? history.state.route : location.hash || href('now');
  index = last = history.state && typeof history.state.i === 'number' ? history.state.i : 0;
  // 控えた位置が無ければ（新しく開いた）null のまま渡し、住所の場所へ飛ばす
  const startY = stateY(history.state);
  setState('replaceState', first, startY || 0);
  draw(first, startY);
  if ('showDirectoryPicker' in window) {
    store('readonly', (s) => s.get('docs'))
      .then(async (dir) => {
        if (!dir) return;
        folder = dir;
        await syncFromDisk().catch(() => {});
        // 行が入って高さが変わるので、控えた位置へ戻し直す
        render(parse(shown), startY != null ? startY : window.scrollY);
      })
      .catch(() => { /* 覚えたフォルダが無い。答える行は出さない */ });
  }
})();
</script>
</body>
</html>
